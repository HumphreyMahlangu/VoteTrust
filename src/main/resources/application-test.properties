spring.datasource.url=jdbc:h2:mem:votetrust;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

votetrust.security.jwt.secret=test-secret-value-for-votetrust-auth-tests-32-chars-minimum
votetrust.security.jwt.issuer=votetrust-api-test
votetrust.security.jwt.access-token-expiration-minutes=15
votetrust.security.identity-hash-pepper=test-identity-hash-pepper-for-registration-tests-32-chars-minimum
votetrust.security.vote-credential-pepper=test-vote-credential-pepper-for-voting-tests-32-chars-minimum
