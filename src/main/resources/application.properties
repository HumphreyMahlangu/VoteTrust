spring.application.name=votetrust-api

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/votetrust}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:votetrust}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:votetrust}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

votetrust.security.jwt.secret=${VOTETRUST_JWT_SECRET}
votetrust.security.jwt.issuer=${VOTETRUST_JWT_ISSUER:votetrust-api}
votetrust.security.jwt.access-token-expiration-minutes=${VOTETRUST_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
votetrust.security.identity-hash-pepper=${VOTETRUST_ID_HASH_PEPPER}
votetrust.security.vote-credential-pepper=${VOTETRUST_VOTE_CREDENTIAL_PEPPER}
