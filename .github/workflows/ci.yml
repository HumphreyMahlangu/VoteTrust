name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Maven Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker version

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Run Maven verification
        run: ./mvnw -B clean verify

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example config

      - name: Build container image
        run: docker build -t votetrust-api:ci .
